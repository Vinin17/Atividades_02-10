<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
</head>
<body>

  <h1>Cadastro de Alunos</h1>

  <table border="1" cellpadding="15" width="100%">
    <tr>

      <td valign="top" width="50%">
        <h2>Formulário</h2>

        <form id="cadastroForm" novalidate>

          <label for="nome">Nome Completo:</label><br>
          <input type="text" id="nome" placeholder="Digite seu nome completo" required>
          <br>
          <span id="erroNome" style="color: red;"></span>
          <br><br>

          <label for="email">E-mail Institucional:</label><br>
          <input type="email" id="email" placeholder="seunome@escola.edu.br" required>
          <br>
          <span id="erroEmail" style="color: red;"></span>
          <br><br>

          <label for="senha">Senha de Acesso:</label><br>
          <input type="password" id="senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
          <br>
          <span id="erroSenha" style="color: red;"></span>
          <br><br>

          <label for="confirmaSenha">Confirmação de Senha:</label><br>
          <input type="password" id="confirmaSenha" placeholder="Digite a senha novamente" required>
          <br>
          <span id="erroConfirma" style="color: red;"></span>
          <br><br>

          <label for="perfil">Perfil Técnico:</label><br>
          <select id="perfil" required>
            <option value="">Selecione uma área...</option>
            <option value="Redes">Redes</option>
            <option value="Desenvolvimento">Desenvolvimento</option>
            <option value="Suporte">Suporte</option>
          </select>
          <br>
          <span id="erroPerfil" style="color: red;"></span>
          <br><br>

          <input type="checkbox" id="termos" required>
          <label for="termos">Li e aceito os termos de uso</label>
          <br>
          <span id="erroTermos" style="color: red;"></span>
          <br><br>

          <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagemSucesso" style="color: green;"></p>
      </td>

      <td valign="top" width="50%">
        <h2>Dados Cadastrados</h2>
        <p id="avisoVazio">Nenhum cadastro realizado ainda.</p>

        <div id="painelSaida" hidden>
          <p><b>Nome:</b> <span id="saidaNome"></span></p>
          <p><b>E-mail:</b> <span id="saidaEmail"></span></p>
          <p><b>Perfil Técnico:</b> <span id="saidaPerfil"></span></p>
        </div>
      </td>

    </tr>
  </table>

  <script src="script.js"></script>
</body>
</html>
